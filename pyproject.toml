[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azsec-kit"
version = "0.1.0"
description = "Azure Security Lab Toolkit (Week-by-week evidence automation)"
requires-python = ">=3.10"

[project.scripts]
azsec = "azsec_kit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

